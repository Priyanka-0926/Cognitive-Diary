<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cognitive Diary · AI Career Discovery (Java Edition)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
        .font-editorial { font-family: 'Fraunces', Georgia, serif; }
        .font-mono-tabular { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
    </style>
</head>
<body class="bg-[#F8F7F4] text-[#222421] min-h-screen antialiased flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="bg-white border-b border-[#E6E3DE] sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-6">
                <a href="/overview" class="flex items-center gap-2 group">
                    <span class="w-8 h-8 rounded bg-[#3E5A46] text-white flex items-center justify-center font-bold text-sm shadow-xs group-hover:bg-[#2A4031] transition-colors">CD</span>
                    <div>
                        <span class="font-editorial text-lg font-semibold tracking-tight text-[#222421] block leading-none">Cognitive Diary</span>
                        <span class="text-[10px] text-[#878D82] font-mono-tabular">Java 17 Spring Edition</span>
                    </div>
                </a>

                <nav class="hidden md:flex items-center gap-1 text-xs font-medium">
                    <a href="/overview" th:classappend="${activeTab == 'overview'} ? 'bg-[#EEF4EE] text-[#2A4031] font-semibold' : 'text-[#5C6059] hover:text-[#222421] hover:bg-[#FAF8F5]'" class="px-3 py-1.5 rounded transition-colors">Overview</a>
                    <a href="/journal" th:classappend="${activeTab == 'journal'} ? 'bg-[#EEF4EE] text-[#2A4031] font-semibold' : 'text-[#5C6059] hover:text-[#222421] hover:bg-[#FAF8F5]'" class="px-3 py-1.5 rounded transition-colors">Write</a>
                    <a href="/archive" th:classappend="${activeTab == 'archive'} ? 'bg-[#EEF4EE] text-[#2A4031] font-semibold' : 'text-[#5C6059] hover:text-[#222421] hover:bg-[#FAF8F5]'" class="px-3 py-1.5 rounded transition-colors">Archive</a>
                    <a href="/strengths" th:classappend="${activeTab == 'strengths'} ? 'bg-[#EEF4EE] text-[#2A4031] font-semibold' : 'text-[#5C6059] hover:text-[#222421] hover:bg-[#FAF8F5]'" class="px-3 py-1.5 rounded transition-colors">Strengths</a>
                    <a href="/careers" th:classappend="${activeTab == 'careers'} ? 'bg-[#EEF4EE] text-[#2A4031] font-semibold' : 'text-[#5C6059] hover:text-[#222421] hover:bg-[#FAF8F5]'" class="px-3 py-1.5 rounded transition-colors">Careers</a>
                    <a href="/roadmap" th:classappend="${activeTab == 'roadmap'} ? 'bg-[#EEF4EE] text-[#2A4031] font-semibold' : 'text-[#5C6059] hover:text-[#222421] hover:bg-[#FAF8F5]'" class="px-3 py-1.5 rounded transition-colors">Roadmap</a>
                    <a href="/settings" th:classappend="${activeTab == 'settings'} ? 'bg-[#EEF4EE] text-[#2A4031] font-semibold' : 'text-[#5C6059] hover:text-[#222421] hover:bg-[#FAF8F5]'" class="px-3 py-1.5 rounded transition-colors">Settings</a>
                </nav>
            </div>

            <div class="flex items-center gap-3">
                <span th:if="${user != null and user.isDemo}" class="text-[11px] font-medium text-[#3E5A46] bg-[#EEF4EE] px-2.5 py-1 rounded border border-[#DCE7DC]">Demo Persona</span>
                <a href="/journal" class="px-3.5 py-1.5 text-xs font-medium text-white bg-[#3E5A46] hover:bg-[#2A4031] rounded transition-colors shadow-xs flex items-center gap-1.5">
                    <span>+ New Entry</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Frame -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div th:replace="${content}"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-[#E6E3DE] py-6 text-center text-xs text-[#878D82]">
        <p>Cognitive Diary · Native Java Spring Boot 3 Engine · Evidence-grounded career growth</p>
    </footer>

</body>
</html>
